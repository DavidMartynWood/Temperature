name: UI test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-test:
    name: UI test (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [android, iphone, ipad, desktop]
    defaults:
      run:
        working-directory: ./lake-temperature

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lake-temperature/package-lock.json

      - run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps ${{ matrix.project == 'iphone' && 'webkit' || matrix.project == 'ipad' && 'webkit' || 'chromium' }}

      - name: Run UI tests
        run: npx playwright test --project=${{ matrix.project }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-${{ matrix.project }}
          path: |
            lake-temperature/test-results/
            lake-temperature/playwright-report/
