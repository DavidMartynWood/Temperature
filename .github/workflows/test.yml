name: Test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotnet-test:
    name: Run .NET tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test Temperature.slnx --configuration Release
