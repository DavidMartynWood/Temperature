name: Deploy QA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    name: Deploy QA Worker (predicted readings database)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./lake-temperature

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lake-temperature/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - name: Apply QA database migrations
        run: npx wrangler d1 migrations apply lake-temperature-qa-db --env qa --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Seed QA database with predicted readings for the next year
        run: |
          node scripts/generate-qa-seed.mjs > qa-seed.sql
          npx wrangler d1 execute lake-temperature-qa-db --env qa --remote --file qa-seed.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy QA Worker
        run: npx wrangler deploy --env qa
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
