<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="theme-color" content="#f2f6f5" />
		<title>Lake temperature</title>
		<link rel="stylesheet" href="/styles.css" />
	</head>
	<body>
		<main>
			<h1>Lake temperature</h1>
			<p id="temperature" aria-live="polite">Loading…</p>
			<p id="reading-time" hidden>
				Reading time: <time id="timestamp"></time>
				<span id="stale-warning" hidden>
					<button type="button" id="stale-warning-button" class="stale-warning" title="This reading is out of date, there may be a technical problem" aria-label="This reading is out of date, there may be a technical problem" aria-expanded="false" aria-controls="stale-warning-message">⚠️</button>
				</span>
			</p>
			<p id="stale-warning-message" class="stale-warning-message" role="status" hidden>This reading is out of date, there may be a technical problem</p>
			<section id="history" aria-labelledby="history-title">
				<h2 id="history-title">Temperature history</h2>
				<div id="range-controls" role="group" aria-label="History range">
					<button type="button" data-range="day" aria-pressed="true">Day</button>
					<button type="button" data-range="week" aria-pressed="false">Week</button>
					<button type="button" data-range="month" aria-pressed="false">Month</button>
					<button type="button" data-range="year" aria-pressed="false">Year</button>
					<button type="button" data-range="all" aria-pressed="false">All</button>
				</div>
				<div id="chart-container">
					<canvas id="chart" role="img" aria-label="Loading temperature history"></canvas>
				</div>
				<p id="history-status" aria-live="polite"></p>
				<p>History available from 18 October 2026.</p>
			</section>
			<footer id="social-links">
				<p>
					<a href="https://www.facebook.com/groups/team.ice.warriors/" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
						<svg aria-hidden="true" viewBox="0 0 24 24">
							<circle cx="12" cy="12" r="12" fill="#0866ff" />
							<path fill="white" d="M13.4 21v-8h2.7l.4-3h-3.1V8.1c0-.9.3-1.5 1.6-1.5h1.7V3.9c-.3 0-1.3-.1-2.5-.1-2.6 0-4.4 1.6-4.4 4.5V10H7v3h2.8v8h3.6z" />
						</svg>
					</a>
					<a href="https://www.instagram.com/icewarriors.ows/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
						<svg aria-hidden="true" viewBox="0 0 24 24">
							<defs>
								<linearGradient id="instagram-gradient" x1="0" y1="1" x2="1" y2="0">
									<stop offset="0" stop-color="#ffdc80" />
									<stop offset="0.5" stop-color="#f56040" />
									<stop offset="1" stop-color="#833ab4" />
								</linearGradient>
							</defs>
							<rect width="24" height="24" rx="6" fill="url(#instagram-gradient)" />
							<rect x="4" y="4" width="16" height="16" rx="5" fill="none" stroke="white" stroke-width="2" />
							<circle cx="12" cy="12" r="3.5" fill="none" stroke="white" stroke-width="2" />
							<circle cx="17.5" cy="6.8" r="1.2" fill="white" />
						</svg>
					</a>
				</p>
			</footer>
		</main>
		<script src="/vendor/chart.umd.js"></script>
		<script src="/vendor/chartjs-adapter-date-fns.bundle.min.js"></script>
		<script type="module" src="/js/main.js"></script>
	</body>
</html>
