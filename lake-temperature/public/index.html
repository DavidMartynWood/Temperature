<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="theme-color" content="#f2f6f5" />
		<title>Lake temperature</title>
		<link rel="stylesheet" href="/styles.css" />
	</head>
	<body>
		<main>
			<h1>Lake temperature</h1>
			<p id="temperature" aria-live="polite">Loading…</p>
			<p id="reading-time" hidden>
				Reading time: <time id="timestamp"></time>
			</p>
			<section id="history" aria-labelledby="history-title">
				<h2 id="history-title">Temperature history</h2>
				<div id="range-controls" role="group" aria-label="History range">
					<button type="button" data-range="day" aria-pressed="true">Day</button>
					<button type="button" data-range="week" aria-pressed="false">Week</button>
					<button type="button" data-range="month" aria-pressed="false">Month</button>
					<button type="button" data-range="year" aria-pressed="false">Year</button>
					<button type="button" data-range="all" aria-pressed="false">All</button>
				</div>
				<div id="chart-container">
					<canvas id="chart" role="img" aria-label="Loading temperature history"></canvas>
				</div>
				<p id="history-status" aria-live="polite"></p>
				<p>History available from 18 October 2026.</p>
			</section>
			<footer id="social-links">
				<p>
					Follow us:
					<a href="https://www.facebook.com/groups/team.ice.warriors/" target="_blank" rel="noopener noreferrer">Facebook</a>
					<span aria-hidden="true">·</span>
					<a href="https://www.instagram.com/icewarriors.ows/" target="_blank" rel="noopener noreferrer">Instagram</a>
				</p>
			</footer>
		</main>
		<script src="/vendor/chart.umd.js"></script>
		<script src="/vendor/chartjs-adapter-date-fns.bundle.min.js"></script>
		<script type="module" src="/js/main.js"></script>
	</body>
</html>
